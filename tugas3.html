<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KALKULATOR(TUGAS 2)</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="body_calculator">
       <div>
         <label for="">Input Bilangan 1</label>
        <input type="number" id="angka1" required>
       </div>
       <br>
     <div>
        <label for="number">Input Bilangan 2</label>
        <input type="number" id="angka2" required>
    </div>
    <br>
    <div id="button_position">
        <button type="button" class="btn" onclick=tambah()>+</button>
         <button type="button" class="btn" onclick=kurang()>-</button>
          <button type="button" class="btn" onclick=kali()>X</button>
           <button type="button" class="btn" onclick=bagi()>/</button>
    </div>
    <br>
    <div>
        <label for="hasil">Output</label>
        <input  type="text" id="hasil" disabled>
    </div>
</div>
<script src="script.js"></script>
</body>
</html>
